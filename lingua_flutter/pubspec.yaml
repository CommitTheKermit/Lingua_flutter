name: lingua
description: Mobile translate tool, translate viewer
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+5

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^8.1.7
  http: ^0.13.6
  url_launcher: ^6.1.12
  shared_preferences: ^2.2.0
  fluttertoast: ^8.2.2
  getwidget: ^5.0.0
  build_runner:
  json_annotation:
  flutter_native_splash: ^2.3.7
  external_path: ^2.0.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.2
  workmanager: ^0.5.2
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  show_more_text_popup: ^0.3.0
  responsive_sizer: ^3.3.1
  provider: ^6.1.2
  dio: ^5.5.0+1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  json_serializable: ^6.7.1
  change_app_package_name: ^1.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - envs/deploy/
    - shorebird.yaml

  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSansKR-VariableFont_wght.ttf
          weight: 500
    - family: Neo
      fonts:
        - asset: assets/fonts/neo.ttf
          weight: 500
    - family: Gangwon
      fonts:
        - asset: assets/fonts/GANGWONSTATE-SemiBold.ttf
          weight: 500
    - family: Gmarket
      fonts:
        - asset: assets/fonts/GmarketSansTTFLight.ttf
          weight: 500
    - family: Hakgyo
      fonts:
        - asset: assets/fonts/HakgyoansimWoojuR.ttf
          weight: 500
    - family: Jaemin
      fonts:
        - asset: assets/fonts/Jaemin3-Regular.ttf
          weight: 500
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 500
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
